<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Lambo Index</title>
<style>html,body{margin:0;height:100%;background:#0c0b0a;color:#8a8079;font:14px system-ui,sans-serif}body{display:grid;place-items:center}</style>
</head>
<body>
<p>Opening the latest version…</p>
<script>
/* Bookmark this page. It asks GitHub for the newest commit on main and opens that exact build,
   so it never shows a cached older copy. If GitHub cannot be reached, it opens the main branch. */
(function () {
  var repo = 'wam090/the-lambo-index', hash = location.hash || '';
  var open = function (ref, host) { location.replace('https://' + host + '/' + repo + '/' + ref + '/index.html' + hash); };
  fetch('https://api.github.com/repos/' + repo + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' }, cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (sha) { sha = sha.trim(); if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('bad sha'); open(sha, 'rawcdn.githack.com'); })
    .catch(function () { open('main', 'raw.githack.com'); });
})();
</script>
</body>
</html>
